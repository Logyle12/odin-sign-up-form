<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <title>Sign Up</title>
</head>
<body>
    <div class="sign-up-wrapper">
            <div class="sign-up-card">
                <section class="sign-up-content">
                    <div class="content-wrapper">
                        <section class="content-intro">
        <div class="content-header">
                                <div id="logo-wrapper">
                                    <img  src="UI Icons/Input Icons/gamepad_icon.svg" alt="Video game controller icon" id="logo-icon">
                                </div>
                                <h1 id="content-title">
                                    <span class="heading-primary">Play</span>
                                    <span class="heading-secondary">Vault</span>
                                </h1>
                            </div>
                            <p id="content-tagline">
                                <span class="heading-primary">Your Games.<br></span>    
                                <span class="heading-secondary">All In One Place.</span>
                            </p>
                            <div id="content-description-wrapper">
            <p id="content-description">Create an account to get started. Your library and activity will be saved to your profile.</p>
                            </div>
                        </section>
                        <form class="signup-hero"></section>
            <section class="signup-form">
                <div class="form-wrapper">
                    <form action="POST"></form>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
