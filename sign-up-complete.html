<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/sign-up-complete.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
        <script type="module" src="scripts/sign-up-complete.js"></script>
        <title>Welcome!</title>
    </head>
    <body>
        <div class="corner-accent corner-accent-outer top"></div>
        <div class="corner-accent corner-accent-outer bottom"></div>
        <div class="corner-accent corner-accent-middle top"></div>
        <div class="corner-accent corner-accent-middle bottom"></div>
        <div class="corner-accent corner-accent-inner top"></div>
        <div class="corner-accent corner-accent-inner bottom"></div>
        <div class="success-page">
            <div class="success-layout">
                <section class="success-header">
                    <div id="logo-wrapper">
                        <img src="UI Icons/Input Icons/logo-icon.svg" alt="Video game controller icon" id="logo-icon">
                    </div>
                    <h1 id="brand-title">
                        <span class="heading-primary">Play</span>
                        <span class="heading-secondary">Vault</span>
                    </h1>
                </section>
                <div class="success-icon-container">
                    <img src="UI Images/Success Page/Success Checkmark.png" alt="checkmark">
                </div>
                <section class="success-confirmation">
                    <div class="success-text-container">
                        <h1 id="welcome-title">Welcome!
                            <span class="heading-secondary" id="sign-up-username">[Username]</span>
                        </h1>
                        <div class="welcome-messages">
                            <p class ="welcome-message" id="welcome-message-1">Your account has been successfully created.</p>
                            <p class ="welcome-message" id="welcome-message-2">Get ready to dive into your games.</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
</div>
    </body>
</html>
